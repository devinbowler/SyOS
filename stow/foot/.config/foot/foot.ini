# SyOS - foot terminal.
# Font and colors come from theme.ini, generated by theme/generate.sh.
# foot include files carry their own section scope, so theme.ini re-opens
# [main] itself and this file stays in the default section afterwards.

[main]
include=~/.config/foot/theme.ini
term=foot
pad=6x4
selection-target=clipboard

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
multiplier=3
