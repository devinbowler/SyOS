# SyOS - fuzzel launcher.
# Opened by clicking the launcher button on the bar (Phase 1); results are
# mouse-selectable, so this is a first-class path and not a keyboard-only one.
# Font, colors and border come from theme.ini (theme/generate.sh).

include=~/.config/fuzzel/theme.ini

prompt=">  "
lines=14
width=52
horizontal-pad=14
vertical-pad=10
inner-pad=6
tabs=4
layer=overlay
exit-on-keyboard-focus-loss=no
