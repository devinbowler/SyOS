# SyOS - fuzzel, the application launcher behind the "+" button.
#
# Opened by clicking "+" on the far left of the bar (see syos-menu). Results
# are mouse-selectable, so this is a first-class path and not a keyboard-only
# one. Font, colors and border come from theme.ini (theme/generate.sh).

include=~/.config/fuzzel/theme.ini

# Drop down from directly under the "+" button rather than floating in the
# middle of the screen, so the menu visibly belongs to the thing you clicked.
# y-margin must track BAR_HEIGHT in theme/palette.conf.
anchor=top-left
x-margin=0
y-margin=28

# Ten entries with an empty query, ordered by how often you have launched
# them: the list you see before typing is your ten most-used applications.
lines=10
sort-result=yes
width=46

# Icons make the list scannable at a glance instead of read line by line.
# Papirus is installed by bootstrap; without an icon theme fuzzel still works,
# it just renders text only.
icons-enabled=yes
icon-theme=Papirus-Dark

# Console applications get a terminal to live in rather than failing silently.
terminal=foot -e

prompt="  "
horizontal-pad=14
vertical-pad=10
inner-pad=8
tabs=4
layer=overlay

# Click anywhere else to dismiss, the way a menu is expected to behave. This
# was previously off because focus_follows_mouse meant the menu vanished as
# soon as the pointer crossed another window on the way to it; now that focus
# follows the click, losing focus genuinely means you clicked elsewhere.
# Clicking "+" again also closes it, and so does Escape.
exit-on-keyboard-focus-loss=yes
