# SyOS palette - the single source of truth for every color in the system.
#
# Format: KEY=value, one per line, no spaces around '='. Colors are 6-digit
# hex WITHOUT a leading '#'; generate.sh converts to each program's format
# (sway wants #RRGGBB, foot wants RRGGBB, fuzzel wants RRGGBBAA, CSS wants
# #RRGGBB). Edit here, re-run ./bootstrap.sh, never edit generated fragments.

# --- Surfaces -----------------------------------------------------------
# Neutral greys with no color cast: R, G and B are equal in every surface
# value below, so nothing reads as warm or cool. BG_ALT is unfocused tabs
# and the bar, BG_SEL is selection and hover.
BG=080808
BG_ALT=121212
BG_SEL=1f1f1f

# --- Text ---------------------------------------------------------------
# Neutral light grey, dimmed variant for inactive tabs and bar padding.
FG=d6d6d6
FG_DIM=7c7c7c

# --- Accents ------------------------------------------------------------
# One accent: a bright violet, the only saturated color in the chrome of
# the system. WARN/URGENT double as the focus level indicators:
# accent = L1, amber = L2, red = L3 (design doc 4.5).
ACCENT=a878f0
ACCENT_DIM=6d4aa6
WARN=d9a441
URGENT=cf5a5a

# --- Borders ------------------------------------------------------------
BORDER=242424
BORDER_FOCUS=a878f0

# --- ANSI terminal colors ----------------------------------------------
# Muted so that program output never fights the near-black surfaces.
ANSI_BLACK=1f1f1f
ANSI_RED=cf5a5a
ANSI_GREEN=8fb573
ANSI_YELLOW=d9a441
ANSI_BLUE=7093c4
ANSI_MAGENTA=a878f0
ANSI_CYAN=6fb5ad
ANSI_WHITE=d6d6d6
ANSI_BRIGHT_BLACK=4a4a4a
ANSI_BRIGHT_RED=e07a7a
ANSI_BRIGHT_GREEN=a6c98d
ANSI_BRIGHT_YELLOW=ecbb63
ANSI_BRIGHT_BLUE=8fadd8
ANSI_BRIGHT_MAGENTA=c09bf7
ANSI_BRIGHT_CYAN=8bcdc5
ANSI_BRIGHT_WHITE=f0f0f0

# --- Typography ---------------------------------------------------------
# FONT_FAMILY is a fallback chain. Iosevka Term is vendored by bootstrap
# (not packaged in trixie - see docs/decisions.md); Hack and the generic
# monospace alias guarantee the system is still legible if that download
# failed. FONT_SIZE_DEFAULT is overridden per machine by SYOS_FONT_SIZE
# in ~/.config/syos/local.conf.
FONT_FAMILY=Iosevka Term
FONT_FALLBACK=Hack
FONT_SIZE_DEFAULT=10

# --- Metrics ------------------------------------------------------------
BAR_HEIGHT=28
BORDER_WIDTH=1
