# SyOS palette - the single source of truth for every color in the system.
#
# Format: KEY=value, one per line, no spaces around '='. Colors are 6-digit
# hex WITHOUT a leading '#'; generate.sh converts to each program's format
# (sway wants #RRGGBB, foot wants RRGGBB, fuzzel wants RRGGBBAA, CSS wants
# #RRGGBB). Edit here, re-run ./bootstrap.sh, never edit generated fragments.

# --- Surfaces -----------------------------------------------------------
# Near-black, slightly blue. BG_ALT is unfocused tabs, BG_SEL is selection.
BG=0d0f12
BG_ALT=14171c
BG_SEL=1c2027

# --- Text ---------------------------------------------------------------
# Grey-green foreground, dimmed variant for inactive tabs and bar padding.
FG=c3ccc0
FG_DIM=6a7568

# --- Accents ------------------------------------------------------------
# Desaturated green is the single accent. WARN/URGENT double as the focus
# level indicators: green = L1, amber = L2, red = L3 (design doc 4.5).
ACCENT=7fa06a
ACCENT_DIM=4d6340
WARN=c9a227
URGENT=b04b40

# --- Borders ------------------------------------------------------------
BORDER=262b33
BORDER_FOCUS=7fa06a

# --- ANSI terminal colors ----------------------------------------------
ANSI_BLACK=1c2027
ANSI_RED=b04b40
ANSI_GREEN=7fa06a
ANSI_YELLOW=c9a227
ANSI_BLUE=5f7f9f
ANSI_MAGENTA=8f7a9f
ANSI_CYAN=6a9f95
ANSI_WHITE=c3ccc0
ANSI_BRIGHT_BLACK=3a424d
ANSI_BRIGHT_RED=c96054
ANSI_BRIGHT_GREEN=97b87f
ANSI_BRIGHT_YELLOW=dbb844
ANSI_BRIGHT_BLUE=7b9cbd
ANSI_BRIGHT_MAGENTA=a894b8
ANSI_BRIGHT_CYAN=83b8ad
ANSI_BRIGHT_WHITE=e2e8df

# --- Typography ---------------------------------------------------------
# FONT_FAMILY is a fallback chain. Iosevka Term is vendored by bootstrap
# (not packaged in trixie - see docs/decisions.md); Hack and the generic
# monospace alias guarantee the system is still legible if that download
# failed. FONT_SIZE_DEFAULT is overridden per machine by SYOS_FONT_SIZE
# in ~/.config/syos/local.conf.
FONT_FAMILY=Iosevka Term
FONT_FALLBACK=Hack
FONT_SIZE_DEFAULT=10

# --- Metrics ------------------------------------------------------------
BAR_HEIGHT=24
BORDER_WIDTH=1
